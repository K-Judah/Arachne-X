name: Firmware foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure offline host tests
        run: cmake -S Firmware -B Firmware/build-host -DARACHNE_HOST_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile (project warnings are errors)
        run: cmake --build Firmware/build-host --config Release --parallel
      - name: Test simulation and locked firmware core
        run: ctest --test-dir Firmware/build-host -C Release --output-on-failure

  esp32-compile-only:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned build frontend
        run: python -m pip install -r Firmware/requirements-build.txt
      - name: Cross-compile inert firmware (no upload)
        run: pio run --project-dir Firmware --environment esp32_compile_only
