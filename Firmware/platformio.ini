[platformio]
default_envs = esp32_compile_only
src_dir = esp32/main

[env:esp32_compile_only]
platform = platformio/espressif32@6.10.0
framework = espidf
; Generic compiler/linker target ONLY, not identification of the installed board.
; Physical board revision, pins and flash configuration remain unverified/TBD.
board = esp32dev
platform_packages =
    platformio/framework-espidf@3.50400.0
    platformio/toolchain-xtensa-esp-elf@14.2.0+20241119
extra_scripts = pre:scripts/deny_upload.py
